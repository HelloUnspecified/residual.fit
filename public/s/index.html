<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Residual share</title>
<meta name="description" content="A food or meal shared from Residual. Open it in Residual to add it to your day.">
<meta property="og:title" content="Shared from Residual">
<meta property="og:description" content="Open it in Residual to add it to your day, sized for you.">
<meta name="robots" content="noindex">
<meta name="apple-itunes-app" content="app-id=6782665400">
<!--
  The share page. With Residual installed, iOS opens the app straight from this link (a universal
  link: see /.well-known/apple-app-site-association) and this page never shows. Without it, or when a
  link is opened somewhere iOS doesn't hand to apps, this page reads the share from the part of the
  link after the # (which browsers never send to this server), shows what's in it, and offers to open
  it in Residual through the app's own residual:// link. Nothing is stored or sent anywhere.
-->
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --ink: #1C1C1E; --ink2: #5C5F6B; --rule: #E5E5EA;
    --accent: #2063B0; --green: #057836; --amber: #885703;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --ink: #F5F5F7; --ink2: #98989F; --rule: #2C2C2E;
      --accent: #0A84FF; --green: #3DDC84; --amber: #F2B04A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }
  .mark { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-weight: 600; margin-bottom: 20px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; }
  .kind { color: var(--ink2); font-size: 14px; font-weight: 600; }
  h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 4px 0 6px; }
  .note { color: var(--ink2); margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .brand { color: var(--ink2); font-size: 14px; }
  .grams { font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap; }
  .open {
    display: block; margin: 22px 0 12px; padding: 15px; border-radius: 999px; text-align: center;
    background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
  }
  .open:active { transform: scale(0.98); }
  .hint { color: var(--ink2); font-size: 15px; text-align: center; margin: 0; }
  .get { display: block; margin-top: 18px; padding: 14px; border-radius: 999px; text-align: center; color: var(--accent); font-weight: 600; text-decoration: none; }
  .error { color: var(--amber); }
  .from { color: var(--ink2); font-size: 13px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <path d="M14 5.6 A8.4 8.4 0 1 1 9.06 20.8" fill="none" stroke="var(--green)" stroke-width="3.8" stroke-linecap="round"/>
      <g fill="var(--green)" fill-opacity="0.4"><circle cx="6.29" cy="17.33" r="0.9"/><circle cx="5.6" cy="14.26" r="0.9"/><circle cx="6.1" cy="11.16" r="0.9"/></g>
      <circle cx="8.06" cy="8.06" r="1.9" fill="var(--green)"/>
    </svg>
    Residual
  </div>
  <div class="card" id="card">
    <div class="kind" id="kind">Shared with you</div>
    <h1 id="name">Opening…</h1>
    <p class="note" id="note" hidden></p>
    <ul id="foods"></ul>
    <!-- Anyone can make a link that shows their own words here, on this site (2026-11-13 review). This line
         is in the page, not the script, so it shows whatever the link holds. -->
    <p class="from">Someone sent you this link. The words above are theirs, not Residual's.</p>
  </div>
  <a class="open" id="open" href="residual://share">Open in Residual</a>
  <p class="hint" id="hint">In Residual it's sized for your targets and added as a plan.</p>
  <!-- A recipient without the app is the warmest visitor the site gets: someone they know just sent them
       a meal. Send them where they can get it. This is a static file, so it can't read site.ts: the App
       Store link and the Smart App Banner above repeat its appStoreId. -->
  <a class="get" href="https://apps.apple.com/app/id6782665400">Don't have Residual? Try it free for 14 days</a>
</main>
<script src="/s/share.js" defer></script>
</body>
</html>
